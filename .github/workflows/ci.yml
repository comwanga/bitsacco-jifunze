name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install
        run: npm ci
      # Root browser-test imports include API helpers and their declared dependencies.
      - name: Install the API
        run: npm ci --prefix api
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate content
        run: npm run validate
      - name: Build (includes CSP, link check and performance budget)
        run: npm run build
      - name: Phase 1 and Phase 2 initial JavaScript budgets
        run: npm run check:ux-budget
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser checks (smoke, phone layout, offline, accessibility)
        run: npm run e2e
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  account:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway credentials for a database that lives only as long as this job.
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: jifunze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jifunze_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/jifunze_test
      JIFUNZE_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install
        run: npm ci
      - name: Install the API
        run: npm ci --prefix api
      - name: Type-check the API
        run: npm run api:typecheck
      - name: Audit API production dependencies
        run: npm audit --omit=dev --prefix api --audit-level=low
      - name: API tests (PostgreSQL)
        run: npm run api:test
      - name: Build
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Account browser checks (real API, fake GitHub)
        run: npm run e2e:account
      - name: Validate the compose file
        run: docker compose config -q
      # Builds the API image and runs docker/nginx.conf in front of it: which client address reaches the rate
      # limiter (realip on and off, forged headers), and that no callback code or state reaches any log.
      - name: nginx proxy checks (client address, log redaction)
        run: bash scripts/check-proxy.sh
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: account-playwright-traces
          path: test-results/
          retention-days: 7

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the compose file
        run: docker compose -f lab/compose.yml --profile lite --profile full config -q
      - name: Build the lab image
        run: docker compose -f lab/compose.yml build lab
      - name: Lab unit tests
        run: docker run --rm -v "$PWD:/repo" -w /repo/lab -e PYTHONPATH=/repo/lab jifunze/lab:local python -m unittest discover tests
      - name: Start the lab (lite profile)
        run: lab/lab up
      - name: Run every exercise's model solution and its check
        run: JIFUNZE_LAB_TOKEN="$(lab/lab pair --raw)" python3 lab/tests/smoke_solutions.py --lite
      - name: Node logs
        if: failure()
        run: docker compose -f lab/compose.yml --profile lite --profile full logs --tail 200
