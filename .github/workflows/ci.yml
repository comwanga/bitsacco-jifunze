name: CI

on:
  pull_request:
  push:
    branches: [main, deploy/railway-staging, release/public-education]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install
        run: npm ci
      # Root browser-test imports include API helpers and their declared dependencies.
      - name: Install the API
        run: npm ci --prefix api
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate content
        run: npm run validate
      - name: Build (includes CSP, link check and performance budget)
        run: npm run build
      - name: Build the staging web image and verify exported origin/noindex
        env:
          SITE_ORIGIN: https://staging.bitsaccojifunze.xyz
        run: |
          docker build --build-arg SITE_ORIGIN="$SITE_ORIGIN" -t jifunze/railway-web:ci .
          docker create --name jifunze-staging-export jifunze/railway-web:ci
          trap 'docker rm -f jifunze-staging-export >/dev/null 2>&1 || true' EXIT
          mkdir -p .superpowers/staging-export
          docker cp jifunze-staging-export:/usr/share/nginx/html/. .superpowers/staging-export/
          node scripts/check-staging-export.mjs .superpowers/staging-export
          docker run --rm --network none --memory=64m -e JIFUNZE_HOSTING=railway -e NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 -e API_HOST=api.railway.internal -e SITE_ORIGIN="$SITE_ORIGIN" jifunze/railway-web:ci nginx -t
      - name: Phase 1 and Phase 2 initial JavaScript budgets
        run: npm run check:ux-budget
      - name: Public export metadata and static nginx isolation
        run: |
          node scripts/check-public-export.mjs
          node scripts/check-public-runtime.mjs
      - name: Install Chromium and WebKit for browser checks
        run: npx playwright install --with-deps chromium webkit
      - name: Browser checks (smoke, phone layout, offline, accessibility)
        run: npm run e2e
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  account:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        # Throwaway credentials for a database that lives only as long as this job.
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: jifunze_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jifunze_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only@127.0.0.1:5432/jifunze_test
      JIFUNZE_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Pin npm
        run: npm install --global npm@12.0.2
      - name: Install
        run: npm ci
      - name: Install the API
        run: npm ci --prefix api
      - name: Type-check the API
        run: npm run api:typecheck
      - name: Audit API production dependencies
        run: npm audit --omit=dev --prefix api --audit-level=low
      - name: API tests (PostgreSQL)
        run: npm run api:test
      - name: Build account acceptance export
        env:
          SITE_ORIGIN: http://127.0.0.1:4352
          # The account suites also exercise the retained GitHub module against a fake provider.
          JIFUNZE_GITHUB_SIGNIN: "1"
        run: npm run build
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Account browser checks (real API, fake GitHub)
        run: npm run e2e:account -- --workers=1
      - name: Learner account lifecycle (fresh API, real recovery limits)
        run: npm run e2e:learner-account
      - name: Remote signing (simulated signer and relay, not signer-app interoperability)
        run: npm run e2e:remote-account
      - name: Tester allowlist browser checks (real API, fake GitHub)
        run: npm run e2e:allowlist
      - name: Validate the compose file
        run: docker compose config -q
      - name: Railway nginx ingress contract (synthetic, not live Railway acceptance)
        run: node scripts/check-railway-proxy.mjs
      # Builds the API image and runs docker/nginx.conf in front of it: which client address reaches the rate
      # limiter (realip on and off, forged headers), and that no callback code or state reaches any log.
      - name: nginx proxy checks (client address, log redaction)
        run: bash scripts/check-proxy.sh
      - name: Keep browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: account-playwright-traces
          path: test-results/
          retention-days: 7

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the compose file
        run: docker compose -f lab/compose.yml --profile lite --profile full config -q
      - name: Build the lab image
        run: docker compose -f lab/compose.yml build lab
      - name: Lab unit tests
        run: docker run --rm -v "$PWD:/repo" -w /repo/lab -e PYTHONPATH=/repo/lab jifunze/lab:local python -m unittest discover tests
      - name: Start the lab (lite profile)
        run: lab/lab up
      - name: Run every exercise's model solution and its check
        run: JIFUNZE_LAB_TOKEN="$(lab/lab pair --raw)" python3 lab/tests/smoke_solutions.py --lite
      - name: Node logs
        if: failure()
        run: docker compose -f lab/compose.yml --profile lite --profile full logs --tail 200
