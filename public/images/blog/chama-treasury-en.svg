<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A chama treasury with three signers, a wallet that needs two of three signatures, a configuration record and separate backups</title>
  <rect width="800" height="460" rx="24" fill="#fbf7f1"/>
  <!-- members approve -->
  <rect x="270" y="24" width="260" height="64" rx="14" fill="#1b2550"/>
  <text x="400" y="52" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Members approve</text>
  <text x="400" y="74" text-anchor="middle" font-size="14" fill="#d6e2e6">minutes and an agreed expense</text>
  <path d="M400 88 V150" stroke="#1b2550" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- wallet -->
  <rect x="290" y="150" width="220" height="110" rx="18" fill="#0f766e"/>
  <text x="400" y="190" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Group wallet</text>
  <text x="400" y="216" text-anchor="middle" font-size="16" fill="#e6fffb">needs 2 of 3 signatures</text>
  <text x="400" y="240" text-anchor="middle" font-size="14" fill="#ccfbf1">to pay out</text>
  <!-- signers -->
  <g font-size="15" text-anchor="middle">
    <circle cx="110" cy="205" r="44" fill="#f59e0b"/>
    <text x="110" y="201" font-weight="700" fill="#1b2550">Key 1</text>
    <text x="110" y="220" fill="#1b2550">treasurer</text>
    <circle cx="110" cy="340" r="44" fill="#f59e0b"/>
    <text x="110" y="336" font-weight="700" fill="#1b2550">Key 2</text>
    <text x="110" y="355" fill="#1b2550">secretary</text>
    <circle cx="690" cy="205" r="44" fill="#f59e0b"/>
    <text x="690" y="201" font-weight="700" fill="#1b2550">Key 3</text>
    <text x="690" y="220" fill="#1b2550">member</text>
  </g>
  <path d="M154 205 H290 M150 320 L300 250 M646 205 H510" stroke="#92400e" stroke-width="3"/>
  <!-- configuration record -->
  <rect x="560" y="300" width="200" height="110" rx="12" fill="#fff" stroke="#1b2550" stroke-width="2"/>
  <text x="660" y="332" text-anchor="middle" font-size="16" font-weight="700" fill="#1b2550">Wallet setup record</text>
  <text x="660" y="356" text-anchor="middle" font-size="13" fill="#3f3f46">threshold and public keys</text>
  <text x="660" y="376" text-anchor="middle" font-size="13" fill="#3f3f46">cannot sign on its own</text>
  <text x="660" y="396" text-anchor="middle" font-size="13" fill="#3f3f46">kept private</text>
  <!-- backups -->
  <g font-size="13" text-anchor="middle" fill="#1b2550">
    <rect x="230" y="320" width="92" height="56" rx="10" fill="#fde68a"/>
    <text x="276" y="344" font-weight="700">Backup 1</text>
    <text x="276" y="362">place A</text>
    <rect x="334" y="320" width="92" height="56" rx="10" fill="#fde68a"/>
    <text x="380" y="344" font-weight="700">Backup 2</text>
    <text x="380" y="362">place B</text>
    <rect x="438" y="320" width="92" height="56" rx="10" fill="#fde68a"/>
    <text x="484" y="344" font-weight="700">Backup 3</text>
    <text x="484" y="362">place C</text>
  </g>
  <text x="380" y="408" text-anchor="middle" font-size="13" fill="#57534e">separate places, not one bag or one cloud account</text>
</svg>
