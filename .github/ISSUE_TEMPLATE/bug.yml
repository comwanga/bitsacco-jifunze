name: Bug
description: Something on the site doesn't work
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page URL
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone or browser
      placeholder: Tecno Spark 10, Chrome
