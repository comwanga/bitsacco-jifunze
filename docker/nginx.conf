# Static server for the Jifunze export. Runs as non-root (nginx-unprivileged) on port 8080.
# It also proxies /api/ to the account API (compose service "api"); the learning site never needs it.

# For /api/: the path only. Never the query string (the GitHub callback's code and state, the return path),
# the referrer, cookies, Authorization or bodies.
log_format api_redacted '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time upstream=$upstream_status';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  error_page 404 /404.html;

  # Docker's DNS, asked at request time: the learning site still starts and serves pages without an API.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Pages and the service worker must always be revalidated so updates reach readers.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html $uri.html =404;
  }

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Answered here with a body (the API's not_found shape), so error_page does not turn it into the HTML 404,
  # which would be logged in the main format, query string included.
  location /api/internal/ {
    access_log /var/log/nginx/access.log api_redacted;
    error_log /var/log/nginx/error.log crit;
    include /etc/nginx/snippets/security-headers.conf;
    default_type "application/json; charset=utf-8";
    return 404 '{"error":{"code":"not_found","message_sw":"Hatukupata ukurasa au kitu ulichotafuta.","message_en":"We could not find what you were looking for."}}';
  }

  location /api/ {
    access_log /var/log/nginx/access.log api_redacted;
    # nginx error lines quote the full request line, so an upstream error would log the callback's code and
    # state. They are suppressed below crit here. In an outage, read the access log's status and upstream=
    # fields and the api container's own logs.
    error_log /var/log/nginx/error.log crit;
    set $api http://api:3001;
    proxy_pass $api;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    # The API sends its own no-referrer; the shared snippet below adds the site's one.
    proxy_hide_header Referrer-Policy;
    include /etc/nginx/snippets/security-headers.conf;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
  }
}
