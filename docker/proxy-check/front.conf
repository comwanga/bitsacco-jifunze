# Stand-in for the production HTTPS terminator. It appends the learner's address to X-Forwarded-For, as most
# proxies do, so a learner can still send a forged X-Forwarded-For of their own in front of it.
server {
  listen 8080;
  access_log off;
  location / {
    proxy_pass http://10.231.2.3:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
