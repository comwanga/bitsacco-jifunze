<svg xmlns="http://www.w3.org/2000/svg" width="400" height="590" viewBox="0 0 400 590" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-labelledby="t">
  <title id="t">A chama treasury: members approve, a group wallet needs two of three signatures from three key holders, a setup record and backups in separate places</title>
  <rect width="400" height="590" rx="20" fill="#fbf7f1"/>
  <rect x="20" y="20" width="360" height="72" rx="14" fill="#1b2550"/>
  <text x="200" y="51" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">Members approve</text>
  <text x="200" y="76" text-anchor="middle" font-size="15" fill="#d6e2e6">minutes and an agreed expense</text>
  <path d="M200 92 V125" stroke="#1b2550" stroke-width="3" stroke-dasharray="6 6"/>
  <rect x="60" y="125" width="280" height="95" rx="16" fill="#0f766e"/>
  <text x="200" y="160" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Group wallet</text>
  <text x="200" y="186" text-anchor="middle" font-size="16" fill="#e6fffb">needs 2 of 3 signatures</text>
  <text x="200" y="208" text-anchor="middle" font-size="15" fill="#ccfbf1">to pay out</text>
  <path d="M120 220 L70 250 M200 220 V250 M280 220 L330 250" stroke="#92400e" stroke-width="3"/>
  <g text-anchor="middle" fill="#1b2550">
    <rect x="12" y="250" width="116" height="70" rx="14" fill="#f59e0b"/>
    <text x="70" y="281" font-size="16" font-weight="700">Key 1</text>
    <text x="70" y="302" font-size="14">treasurer</text>
    <rect x="142" y="250" width="116" height="70" rx="14" fill="#f59e0b"/>
    <text x="200" y="281" font-size="16" font-weight="700">Key 2</text>
    <text x="200" y="302" font-size="14">secretary</text>
    <rect x="272" y="250" width="116" height="70" rx="14" fill="#f59e0b"/>
    <text x="330" y="281" font-size="16" font-weight="700">Key 3</text>
    <text x="330" y="302" font-size="14">member</text>
  </g>
  <rect x="20" y="345" width="360" height="110" rx="12" fill="#fff" stroke="#1b2550" stroke-width="2"/>
  <text x="200" y="374" text-anchor="middle" font-size="17" font-weight="700" fill="#1b2550">Wallet setup record</text>
  <text x="200" y="398" text-anchor="middle" font-size="14" fill="#3f3f46">threshold and public keys</text>
  <text x="200" y="418" text-anchor="middle" font-size="14" fill="#3f3f46">cannot sign on its own</text>
  <text x="200" y="438" text-anchor="middle" font-size="14" fill="#3f3f46">kept private</text>
  <g text-anchor="middle" fill="#1b2550">
    <rect x="14" y="478" width="112" height="62" rx="10" fill="#fde68a"/>
    <text x="70" y="505" font-size="15" font-weight="700">Backup 1</text>
    <text x="70" y="526" font-size="14">place A</text>
    <rect x="144" y="478" width="112" height="62" rx="10" fill="#fde68a"/>
    <text x="200" y="505" font-size="15" font-weight="700">Backup 2</text>
    <text x="200" y="526" font-size="14">place B</text>
    <rect x="274" y="478" width="112" height="62" rx="10" fill="#fde68a"/>
    <text x="330" y="505" font-size="15" font-weight="700">Backup 3</text>
    <text x="330" y="526" font-size="14">place C</text>
  </g>
  <text x="200" y="568" text-anchor="middle" font-size="14" fill="#57534e">separate places, not one bag</text>
</svg>
